<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — VanPay Gateway</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/"><img src="/logo.svg" alt="VanPay"><b>VanPay</b></a>
      <nav class="spacer"></nav>
      <a class="lnk" id="navLink" href="/">Beranda</a>
    </div>
  </header>

  <div class="dash">
    <aside class="sbar">
      <div class="prof">
        <img id="pAv" alt="avatar">
        <div>
          <b id="pName">—</b>
          <span id="pBadge"></span>
          <span id="pEmail"></span>
        </div>
      </div>
      <nav id="nav"></nav>
      <div style="padding: 12px 16px">
        <a class="btn ghost" style="width:100%;border-color:#334155;color:#cbd5e1" href="/logout">Keluar</a>
      </div>
    </aside>

    <main id="main">
      <section class="page on" id="pg-load">
        <div class="card" style="text-align:center;padding:60px">Memuat dashboard…</div>
      </section>

      <section class="page" id="pg-overview"><div class="card">—</div></section>
      <section class="page" id="pg-pay"><div class="card">—</div></section>
      <section class="page" id="pg-payments"><div class="card">—</div></section>
      <section class="page" id="pg-withdraw"><div class="card">—</div></section>
      <section class="page" id="pg-ledger"><div class="card">—</div></section>

      <section class="page" id="pg-o-overview"><div class="card">—</div></section>
      <section class="page" id="pg-o-users"><div class="card">—</div></section>
      <section class="page" id="pg-o-payments"><div class="card">—</div></section>
      <section class="page" id="pg-o-withdrawals"><div class="card">—</div></section>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
